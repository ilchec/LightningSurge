<template>
  <div class="slds-p-around_medium picker-container">
    <lightning-spinner lwc:if={isLoadingObjects} alternative-text="Loading objects" size="medium"></lightning-spinner>
    <template lwc:else>
      <div lwc:if={errorText} class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
        <span>{errorText}</span>
      </div>
      <p class="slds-text-body_regular slds-m-bottom_medium">
        Choose an object to start adding or updating records in bulk.
      </p>
      <div class="picker-combobox">
        <lightning-combobox
          label="Object"
          placeholder="Select an object..."
          options={objectOptions}
          disabled={isOpening}
          onchange={handleObjectSelect}
        ></lightning-combobox>
      </div>
      <lightning-spinner lwc:if={isOpening} alternative-text="Opening" size="small"></lightning-spinner>
    </template>
  </div>
</template>
