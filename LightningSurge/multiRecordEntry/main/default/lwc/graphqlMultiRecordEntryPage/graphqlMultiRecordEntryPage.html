<template>
  <div class="slds-p-around_medium">
    <template lwc:if={diagnosticsText}>
      <p class="slds-m-bottom_small">
        Could not determine the object to create records for. Copy the context below and share it so this can be fixed:
      </p>
      <pre class="slds-scrollable_x">{diagnosticsText}</pre>
    </template>
    <template lwc:else>
      <p lwc:if={errorText} class="slds-text-color_error slds-m-bottom_small">{errorText}</p>
      <lightning-button
        label="Add Records"
        variant="brand"
        onclick={handleOpenClick}
        disabled={isOpening}
      ></lightning-button>
    </template>
  </div>
</template>
