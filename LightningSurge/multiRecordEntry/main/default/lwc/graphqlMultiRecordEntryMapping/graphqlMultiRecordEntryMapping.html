<template>
  <div class="slds-grid slds-gutters slds-wrap mapping-container">
    <div class="slds-col slds-size_1-of-2 csv-column">
      <h3 class="slds-text-heading_small slds-m-bottom_small">CSV Columns</h3>
      <div class="slds-box slds-theme_shade csv-pool" ondragover={handlePoolDragOver} ondrop={handlePoolDrop}>
        <template for:each={unmappedChips} for:item="chip">
          <span
            key={chip.header}
            class="slds-badge slds-m-around_xx-small csv-chip"
            draggable="true"
            data-header={chip.header}
            ondragstart={handleChipDragStart}
          >
            {chip.header}
          </span>
        </template>
        <p lwc:if={hasNoUnmappedHeaders} class="slds-text-color_weak slds-p-around_small">All columns mapped</p>
      </div>
    </div>
    <div class="slds-col slds-size_1-of-2 fields-column">
      <h3 class="slds-text-heading_small slds-m-bottom_small">Salesforce Fields</h3>
      <template for:each={mappingRows} for:item="row">
        <div key={row.apiName} class="slds-p-vertical_x-small field-row">
          <div class="slds-truncate field-label" title={row.label}>
            {row.label}<abbr lwc:if={row.required} class="slds-required" title="required">*</abbr>
          </div>
          <label class="slds-checkbox_faux-container match-field-toggle" title="Use as match key">
            <input
              type="checkbox"
              checked={row.isMatchField}
              data-api-name={row.apiName}
              onchange={handleMatchFieldToggle}
            />
            <span class="slds-checkbox_faux"></span>
            <span class="slds-form-element__label slds-text-body_small">Match key</span>
          </label>
          <div class="mapping-target">
            <lightning-combobox
              class="mapping-select"
              label={row.label}
              variant="label-hidden"
              placeholder="Choose a column..."
              value={row.comboboxValue}
              options={row.comboboxOptions}
              data-api-name={row.apiName}
              onchange={handleMappingSelect}
            ></lightning-combobox>
            <div
              class="slds-box slds-box_x-small drop-zone"
              data-api-name={row.apiName}
              ondragover={handleFieldDragOver}
              ondragleave={handleFieldDragLeave}
              ondrop={handleFieldDrop}
            >
              <template lwc:if={row.isMapped}>
                <span
                  class="slds-badge csv-chip"
                  draggable="true"
                  data-header={row.mappedHeader}
                  ondragstart={handleChipDragStart}
                >
                  {row.mappedHeader}
                  <button
                    class="slds-button slds-button_icon slds-button_icon-x-small slds-m-left_xx-small"
                    data-header={row.mappedHeader}
                    onclick={handleUnmapClick}
                    title="Remove mapping"
                  >
                    <lightning-icon
                      icon-name="utility:close"
                      size="xx-small"
                      alternative-text="Remove mapping"
                    ></lightning-icon>
                  </button>
                </span>
              </template>
              <template lwc:else>
                <span class="slds-text-color_weak slds-text-body_small">or drop a column here</span>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</template>
