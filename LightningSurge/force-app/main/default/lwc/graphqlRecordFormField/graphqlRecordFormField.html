<template>
  <template lwc:if={isTextLike}>
    <lightning-input
      data-input
      type={field.type}
      label={field.label}
      value={field.value}
      required={field.required}
      disabled={isDisabled}
      onchange={handleChange}
    ></lightning-input>
  </template>
  <template lwc:elseif={isNumber}>
    <lightning-input
      data-input
      type="number"
      step={field.step}
      label={field.label}
      value={field.value}
      required={field.required}
      disabled={isDisabled}
      onchange={handleChange}
    ></lightning-input>
  </template>
  <template lwc:elseif={isCheckbox}>
    <div class="checkbox-field">
      <span class="slds-form-element__label checkbox-field-label">
        {field.label}<abbr lwc:if={field.required} class="slds-required" title="required">*</abbr>
      </span>
      <div class="checkbox-field-input">
        <lightning-input
          data-input
          type="checkbox"
          variant="label-hidden"
          label={field.label}
          checked={field.value}
          disabled={isDisabled}
          onchange={handleChange}
        ></lightning-input>
      </div>
    </div>
  </template>
  <template lwc:elseif={isDate}>
    <lightning-input
      data-input
      type="date"
      label={field.label}
      value={field.value}
      required={field.required}
      disabled={isDisabled}
      onchange={handleChange}
    ></lightning-input>
  </template>
  <template lwc:elseif={isDateTime}>
    <lightning-input
      data-input
      type="datetime-local"
      label={field.label}
      value={localDateTimeValue}
      required={field.required}
      disabled={isDisabled}
      onchange={handleChange}
    ></lightning-input>
  </template>
  <template lwc:elseif={isTextarea}>
    <lightning-textarea
      data-input
      label={field.label}
      value={field.value}
      required={field.required}
      disabled={isDisabled}
      onchange={handleChange}
    ></lightning-textarea>
  </template>
  <template lwc:elseif={isPicklist}>
    <lightning-combobox
      data-input
      label={field.label}
      value={field.value}
      options={field.options}
      required={field.required}
      disabled={isDisabled}
      onchange={handleChange}
    ></lightning-combobox>
  </template>
  <template lwc:elseif={isMultiPicklist}>
    <lightning-dual-listbox
      data-input
      label={field.label}
      source-label="Available"
      selected-label="Selected"
      value={multiPicklistValue}
      options={field.options}
      required={field.required}
      disabled={isDisabled}
      onchange={handleChange}
    ></lightning-dual-listbox>
  </template>
  <template lwc:elseif={isReference}>
    <lightning-record-picker
      data-input
      label={field.label}
      object-api-name={field.referenceObjectApiName}
      value={field.value}
      required={field.required}
      disabled={isDisabled}
      onchange={handleChange}
    ></lightning-record-picker>
  </template>
</template>
