<template>
  <lightning-spinner lwc:if={isLoading} alternative-text="Loading form" size="medium"></lightning-spinner>
  <template lwc:else>
    <div lwc:if={hasError} class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
      <span>{errorMessage}</span>
    </div>

    <template lwc:if={hasSections}>
      <template for:each={sections} for:item="section">
        <div key={section.id} class="slds-box slds-box_x-small slds-m-bottom_medium">
          <h3 lwc:if={section.heading} class="slds-text-heading_small slds-m-bottom_small">{section.heading}</h3>
          <template for:each={section.rows} for:item="row">
            <div key={row.id} class="slds-grid slds-wrap slds-gutters">
              <template for:each={row.items} for:item="item">
                <div key={item.apiName} class={section.colClass}>
                  <div class="slds-p-around_x-small">
                    <c-graphql-record-form-field
                      field={item}
                      onfieldchange={handleFieldChange}
                    ></c-graphql-record-form-field>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </template>

    <div class="slds-grid slds-grid_align-end slds-m-top_medium">
      <lightning-button
        lwc:if={hideCancelButton}
        variant="neutral"
        label={cancelButtonLabel}
        class="slds-hide"
      ></lightning-button>
      <template lwc:else>
        <lightning-button
          variant="neutral"
          label={cancelButtonLabel}
          onclick={handleCancel}
          class="slds-m-right_x-small"
        ></lightning-button>
      </template>
      <lightning-button
        variant="brand"
        label={saveButtonLabel}
        disabled={isSaveDisabled}
        onclick={handleSave}
      ></lightning-button>
    </div>
  </template>
</template>
